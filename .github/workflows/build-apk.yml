name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Copy web assets into Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -R www/. android/app/src/main/assets/public/

      - name: Verify Android Gradle project
        shell: bash
        run: |
          test -f android/settings.gradle
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/capacitor.build.gradle
          echo "Android project verified"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: actionables-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
