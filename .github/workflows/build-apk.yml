name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Android/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android project
        working-directory: ./Android
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Android project:"
          ls -la android

          echo "Gradle wrapper:"
          ls -la android/gradlew

      - name: Install npm dependencies
        working-directory: ./Android
        run: npm ci

      - name: Capacitor copy web assets
        working-directory: ./Android
        run: npx cap copy android

      - name: Grant Gradle execute permission
        working-directory: ./Android
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ./Android
        run: ./android/gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: actionables-debug-apk
          path: Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
