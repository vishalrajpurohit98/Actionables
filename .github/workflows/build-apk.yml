name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Android/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        working-directory: ./Android
        run: npm ci

      - name: Sync Capacitor
        working-directory: ./Android
        run: npx cap sync android

      - name: Prepare Gradle wrapper
        working-directory: ./Android/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Verify Android Gradle project
        working-directory: ./Android/android
        run: |
          echo "Current directory:"
          pwd
          echo "Gradle files:"
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradlew

      - name: Build debug APK
        working-directory: ./Android/android
        run: ./gradlew assembleDebug

      - name: Verify APK
        working-directory: ./Android/android
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: actionables-debug-apk
          path: Android/android/app/build/outputs/apk/debug/app-debug.apk
