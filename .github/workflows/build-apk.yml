name: Build Android APK

# Rebuild the APK whenever the app code changes on main.
# Skips runs that only touch docs so you don't burn minutes needlessly.
on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'vendor/**'
      - 'widgets/**'
      - 'android-wrapper/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

permissions:
  contents: write      # needed to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        working-directory: android-wrapper
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          BUILD_TOOLS_VER: 35.0.0
          PLATFORM_VER: android-34
          WEB_DIR: ..
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          OUT_APK: ${{ github.workspace }}/Actionables.apk
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Actionables-apk
          path: Actionables.apk
          if-no-files-found: error

      # Optional: also publish a Release with a stable download URL.
      # Every push to main updates the "latest" release in place.
      - name: Publish to Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: Actionables.apk
          make_latest: true
