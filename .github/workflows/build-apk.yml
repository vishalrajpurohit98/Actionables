name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Android/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Verify Gradle wrapper
        run: |
          ls -la android/
          test -f android/gradlew
          head -n 1 android/gradlew

      - name: Build debug APK
        run: bash android/gradlew assembleDebug

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: actionables-debug-apk
          path: Android/android/app/build/outputs/apk/debug/app-debug.apk
