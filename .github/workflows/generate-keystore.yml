name: (One-time) Generate signing keystore

# Run this ONCE to create a signing key without installing anything locally.
# It generates the keystore on GitHub's runner, prints the base64 you paste
# into Secrets, and uploads the raw keystore file as a downloadable backup.
#
# HOW TO USE:
#   1. Actions tab -> "(One-time) Generate signing keystore" -> Run workflow.
#      Fill in a password (and optionally alias / your name).
#   2. Open the finished run -> read the log -> copy the 4 values into
#      Settings -> Secrets and variables -> Actions (see names below).
#   3. Download the "keystore-backup" artifact and store release.keystore
#      somewhere safe (you need it to keep shipping updates).
#   4. DELETE this workflow file so the key material isn't regenerated.
#
# Secrets to create from the output:
#   KEYSTORE_BASE64     <- the long base64 block printed in the log
#   KEYSTORE_PASSWORD   <- the password you entered
#   KEY_ALIAS           <- the alias (default: actionables)
#   KEY_PASSWORD        <- same as the password you entered

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Keystore & key password (remember this!)'
        required: true
      alias:
        description: 'Key alias'
        required: true
        default: 'actionables'
      owner:
        description: 'Your name / org (for the certificate)'
        required: true
        default: 'Actionables'

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (has keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass  "${{ github.event.inputs.password }}" \
            -dname "CN=${{ github.event.inputs.owner }}, O=${{ github.event.inputs.owner }}, C=IN"

      - name: Print secret values to copy
        run: |
          echo "======================================================"
          echo " COPY THESE INTO: Settings > Secrets and variables > Actions"
          echo "======================================================"
          echo ""
          echo "Secret name: KEY_ALIAS"
          echo "Value:       ${{ github.event.inputs.alias }}"
          echo ""
          echo "Secret name: KEYSTORE_PASSWORD  (and also KEY_PASSWORD)"
          echo "Value:       (the password you typed when running this)"
          echo ""
          echo "Secret name: KEYSTORE_BASE64"
          echo "Value:       (the single line between the markers below)"
          echo ""
          echo "-----BEGIN KEYSTORE_BASE64-----"
          base64 -w0 release.keystore
          echo ""
          echo "-----END KEYSTORE_BASE64-----"
          echo ""
          echo "After copying: download the keystore-backup artifact,"
          echo "then DELETE this workflow file."

      - name: Upload keystore as backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: release.keystore
          retention-days: 1
