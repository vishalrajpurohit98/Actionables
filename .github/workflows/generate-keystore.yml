name: (One-time) Generate signing keystore

# Run this ONCE. It creates a signing key ON GitHub, then COMMITS it to your
# repo as an encoded file (android-wrapper/keystore.b64). There is NO base64
# to copy by hand - that was the thing that kept breaking.
#
# HOW TO USE:
#   1. First create ONE secret:
#        Settings > Secrets and variables > Actions > New repository secret
#        Name:  KEYSTORE_PASSWORD
#        Value: a password you choose (remember it!)
#   2. Actions tab -> "(One-time) Generate signing keystore" -> Run workflow.
#      (It reads KEYSTORE_PASSWORD from the secret you just made.)
#   3. When it finishes, it has committed android-wrapper/keystore.b64 to main.
#      That's all the build needs. Now just run "Build Android APK".
#
# NOTE: keystore.b64 is your keystore. Keeping it in a PRIVATE repo is fine.
# If your repo is PUBLIC, anyone could download it; in that case tell me and
# I'll switch to an encrypted variant. The password is never committed.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'actionables'
      owner:
        description: 'Your name / org (for the certificate)'
        required: true
        default: 'Actionables'

permissions:
  contents: write   # needed to commit the keystore file back to the repo

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK (has keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and encode to file
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "ERROR: secret KEYSTORE_PASSWORD is not set. Create it first (see file header)."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass  "$KS_PASS" \
            -dname "CN=${{ github.event.inputs.owner }}, O=${{ github.event.inputs.owner }}, C=IN"
          mkdir -p android-wrapper
          base64 -w0 release.keystore > android-wrapper/keystore.b64
          echo "Encoded keystore -> android-wrapper/keystore.b64 ($(stat -c%s android-wrapper/keystore.b64) bytes)"
          echo "${{ github.event.inputs.alias }}" > android-wrapper/keystore.alias

      - name: Commit keystore file to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-wrapper/keystore.b64 android-wrapper/keystore.alias
          git commit -m "Add signing keystore (generated in CI)"
          git push
