name: (One-time) Generate signing keystore

# Run this ONCE. Creates a signing key ON GitHub and COMMITS it to the repo as
# android-wrapper/keystore.b64 (+ keystore.alias). No base64 to copy by hand.
#
# STEPS:
#   1. Settings > Secrets and variables > Actions > New repository secret
#        Name:  KEYSTORE_PASSWORD   Value: a password you choose (remember it)
#   2. Actions > "(One-time) Generate signing keystore" > Run workflow.
#   3. It commits android-wrapper/keystore.b64 to main. Then run "Build Android APK".

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'personaltracker'
      owner:
        description: 'Your name / org (for the certificate)'
        required: true
        default: 'PersonalTracker'

permissions:
  contents: write

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up JDK (has keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore and encode to file
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "ERROR: secret KEYSTORE_PASSWORD is not set. Create it first."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=${{ github.event.inputs.owner }}, O=${{ github.event.inputs.owner }}, C=IN"
          mkdir -p android-wrapper
          base64 -w0 release.keystore > android-wrapper/keystore.b64
          echo "${{ github.event.inputs.alias }}" > android-wrapper/keystore.alias
          echo "Encoded keystore ($(stat -c%s android-wrapper/keystore.b64) bytes)"
      - name: Commit keystore file to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-wrapper/keystore.b64 android-wrapper/keystore.alias
          git commit -m "Add signing keystore (generated in CI)"
          git push
