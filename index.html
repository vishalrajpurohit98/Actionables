<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07090D">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Actionables</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=7.5.11">
</head>
<body class="auth-locked">
<div id="app"></div>
<div id="sheets"></div>
<div id="toastwrap"></div>
<script src="firebase-config.js" defer></script>
<script src="sync.js?v=7.5.11" defer></script>
<script src="seed.js?v=7.5.11" defer></script>
<script src="app.js?v=7.5.11" defer></script>
<script>
/* Export libraries (XLSX ~880KB, jsPDF ~360KB) are loaded lazily on first
   export/import instead of at startup, so the app paints immediately.
   window.loadExportLibs(kind) returns a Promise; kind = 'xlsx' | 'pdf'. */
window.loadExportLibs = (function () {
  var loaded = {}, loading = {};
  function one(src) {
    if (loaded[src]) return Promise.resolve();
    if (loading[src]) return loading[src];
    loading[src] = new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { loaded[src] = true; res(); };
      s.onerror = function () { rej(new Error('Failed to load ' + src)); };
      document.body.appendChild(s);
    });
    return loading[src];
  }
  return function (kind) {
    if (kind === 'xlsx') return one('vendor/xlsx.full.min.js');
    if (kind === 'pdf') return one('vendor/jspdf.umd.min.js').then(function () { return one('vendor/jspdf.autotable.min.js'); });
    return Promise.resolve();
  };
})();
</script>
<script>
/* Register the service worker for offline support & faster loads. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
